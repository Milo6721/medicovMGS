<title>Medicov MGS – Panel</title>
<meta name="theme-color" content="#eaf2fb">
<style>
:root{
  --bg:#e9f1fa; --text:#14202e; --muted:rgba(40,56,78,.62); --accent:#0b72d6; --accent2:#2f9e44; --accent-rgb:11,114,214;
  --glass:linear-gradient(145deg,rgba(255,255,255,.66),rgba(255,255,255,.28));
  --glass-solid:rgba(255,255,255,.78);
  --rim:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,.12) 32%,rgba(255,255,255,.06) 62%,rgba(255,255,255,.75));
  --glass-in:rgba(255,255,255,.95);
  --shadow:0 24px 60px rgba(20,70,140,.15),0 3px 10px rgba(20,70,140,.07);
  --field:rgba(255,255,255,.58); --field-bd:rgba(40,56,78,.1); --sep:rgba(40,56,78,.14); --blob:.55;
  --ok:#2f9e44; --warn:#e8890c; --bad:#e5484d;
}
[data-theme=dark]{
  --bg:#070d16; --text:#f2f6fb; --muted:rgba(225,235,248,.6); --accent:#4aa3ff; --accent-rgb:74,163,255;
  --glass:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
  --glass-solid:rgba(30,40,58,.78);
  --rim:linear-gradient(140deg,rgba(255,255,255,.5),rgba(255,255,255,.05) 32%,rgba(255,255,255,.03) 62%,rgba(255,255,255,.34));
  --glass-in:rgba(255,255,255,.28);
  --shadow:0 24px 60px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.35);
  --field:rgba(255,255,255,.075); --field-bd:rgba(255,255,255,.1); --sep:rgba(255,255,255,.13); --blob:.45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);touch-action:manipulation;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background .5s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.bg{position:fixed;inset:0;overflow:hidden;z-index:-1}
.blob{position:absolute;border-radius:50%;filter:blur(85px);opacity:var(--blob);animation:float 28s ease-in-out infinite alternate;will-change:transform}
.b1{width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:#1d8fe8}
.b2{width:42vmax;height:42vmax;right:-12vmax;top:2vmax;background:#35c0c0;animation-delay:-7s}
.b3{width:46vmax;height:46vmax;left:10vmax;bottom:-28vmax;background:#6cc24a;animation-delay:-13s}
.b4{width:30vmax;height:30vmax;right:4vmax;bottom:-12vmax;background:#3a6fe0;animation-delay:-4s}
@keyframes float{to{transform:translate3d(7vmax,5vmax,0) scale(1.18)}}

.glass{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(34px) saturate(200%) brightness(1.05);backdrop-filter:blur(34px) saturate(200%) brightness(1.05);
  border-radius:30px;box-shadow:var(--shadow),inset 0 1.5px 0 var(--glass-in),inset 0 -1px 0 rgba(255,255,255,.1)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:radial-gradient(460px circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.4),transparent 46%);opacity:.7}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:var(--rim);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
[data-theme=dark] .glass::before{opacity:.3}

/* przyciski i pola */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--glass);font-weight:600;font-size:14.5px;
  position:relative;isolation:isolate;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);white-space:nowrap;
  box-shadow:inset 0 1px 0 var(--glass-in),0 4px 14px rgba(20,70,140,.1),0 0 0 .5px var(--sep);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.btn:hover{transform:scale(1.035)}.btn:active{transform:scale(.95)}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.btn.icon{width:42px;padding:0}
.btn.primary{background:linear-gradient(180deg,#2d8ff0,#0a68c9);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(11,114,214,.38)}
.btn.green{background:linear-gradient(180deg,#58b84f,#2f9e44);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px rgba(47,158,68,.35)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;pointer-events:none}
.field,select.field,textarea.field{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;border:0;background:var(--field);outline:none;box-shadow:0 0 0 .5px var(--field-bd);transition:box-shadow .2s;font-size:15.5px}
textarea.field{min-height:92px;resize:vertical;line-height:1.45}
.field:focus{box-shadow:0 0 0 3.5px rgba(var(--accent-rgb),.35)}
.field::placeholder{color:var(--muted);opacity:.75}
label.fl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px 4px}
.fg{margin-bottom:13px}.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);margin:4px 4px 0}.hint.bad{color:var(--bad)}.hint.ok{color:var(--ok)}
input.ios{-webkit-appearance:none;appearance:none;position:relative;width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.32);border:0;cursor:pointer;transition:background .3s;flex:none;margin:0}
input.ios::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
input.ios:checked{background:#34c759}input.ios:checked::after{transform:translateX(20px)}

/* układ aplikacji */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);gap:20px;max-width:1480px;margin:0 auto;padding:18px;min-height:100vh}
.side{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;padding:20px 14px 16px;border-radius:34px}
.brand{display:flex;justify-content:center;padding:6px 8px 16px}
.brand img{width:178px;max-width:100%;display:block}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:4px;overflow:auto}
.nav a{display:flex;align-items:center;gap:13px;padding:12px 15px;border-radius:16px;color:var(--muted);font-weight:600;transition:background .25s,color .25s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.nav a:hover{background:rgba(255,255,255,.35)}.nav a:active{transform:scale(.97)}
.nav a.on{background:rgba(255,255,255,.78);color:var(--accent);box-shadow:0 2px 12px rgba(20,70,140,.14),inset 0 1px 0 #fff}
[data-theme=dark] .nav a.on{background:rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
[data-theme=dark] .nav a:hover{background:rgba(255,255,255,.07)}
.nav .sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 15px 4px;font-weight:700;opacity:.8}
.me{margin-top:auto;display:flex;align-items:center;gap:11px;padding:10px;border-radius:20px;background:var(--field);box-shadow:0 0 0 .5px var(--field-bd)}
.me .nm{min-width:0;flex:1;line-height:1.2}.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.me small{color:var(--muted);font-size:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14.5px;flex:none;background:linear-gradient(135deg,#2d8ff0,#35b36b);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.av.lg{width:64px;height:64px;font-size:22px}
main{min-width:0;padding-bottom:30px}
.top{display:flex;align-items:center;gap:12px;margin:6px 4px 18px;flex-wrap:wrap}
.top h1{font-size:34px;letter-spacing:-.035em;margin:0;font-weight:800;line-height:1.1}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.top .sp{flex:1}
.mtop{display:none}

/* listy iOS */
.card{padding:18px 18px 16px;margin-bottom:18px}
.card>h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.card>h2 .sp{flex:1}
.list{background:var(--field);border-radius:22px;overflow:hidden;box-shadow:0 0 0 .5px var(--field-bd)}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;position:relative;min-height:62px;transition:background .2s}
a.row:hover{background:rgba(255,255,255,.35)}[data-theme=dark] a.row:hover{background:rgba(255,255,255,.06)}
.row+.row::before{content:"";position:absolute;top:0;left:70px;right:0;height:.5px;background:var(--sep)}
.row.nolead+.row::before,.row.nolead::before{left:16px}
.row .mid{flex:1;min-width:0;line-height:1.3}
.row .mid b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{color:var(--muted);font-size:13px;text-align:right;flex:none}
.row .chev{color:var(--muted);opacity:.6}
.time{width:46px;text-align:center;font-weight:750;font-size:17px;letter-spacing:-.02em;flex:none;font-variant-numeric:tabular-nums}
.time small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.zaplanowana,.pill.blue{background:rgba(var(--accent-rgb),.16);color:var(--accent)}
.pill.w_trakcie,.pill.warn{background:rgba(232,137,12,.18);color:var(--warn)}
.pill.odbyta,.pill.wystawiona,.pill.green{background:rgba(47,158,68,.18);color:var(--ok)}
.pill.odwolana,.pill.anulowana,.pill.nieobecnosc,.pill.red{background:rgba(229,72,77,.16);color:var(--bad)}
.pill.gray{background:rgba(120,130,150,.18);color:var(--muted)}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);width:19px;height:19px}
.search .field{padding-left:44px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--field);box-shadow:inset 0 1px 3px rgba(0,0,0,.07),0 0 0 .5px var(--field-bd);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;height:34px;padding:0 15px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:background .25s,color .25s}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.74));color:var(--text);box-shadow:0 2px 10px rgba(20,70,140,.2),inset 0 1px 0 #fff}
[data-theme=dark] .seg button.on{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px;border-radius:26px}
.kpi small{color:var(--muted);font-weight:600;font-size:12.5px}
.kpi b{display:block;font-size:34px;letter-spacing:-.03em;font-weight:800;line-height:1.15;margin-top:2px}
.kpi i{font-style:normal;font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin-bottom:6px}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 62px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 6px;border-radius:20px;border:0;background:var(--field);box-shadow:0 0 0 .5px var(--field-bd);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.day small{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase}
.day b{font-size:19px;font-weight:750}.day i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0}
.day.has i{opacity:1}
.day.on{background:linear-gradient(180deg,#2d8ff0,#0a68c9);color:#fff;box-shadow:0 6px 16px rgba(11,114,214,.4)}.day.on small{color:rgba(255,255,255,.8)}.day.on i{background:#fff}
.day:active{transform:scale(.94)}
.banner{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:20px;margin-bottom:16px;background:rgba(232,137,12,.16);color:var(--text);box-shadow:0 0 0 .5px rgba(232,137,12,.4)}
.banner svg{color:var(--warn);margin-top:2px}
.banner.info{background:rgba(var(--accent-rgb),.13);box-shadow:0 0 0 .5px rgba(var(--accent-rgb),.35)}.banner.info svg{color:var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:0}
.kv>div{padding:11px 16px;position:relative}.kv>div:nth-child(odd){color:var(--muted);font-size:14px}
.kv>div:nth-child(n+3)::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.kv>div:nth-child(odd)::before{right:auto;width:0}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv>div:nth-child(odd){padding-bottom:0}.kv>div:nth-child(even){padding-top:2px}}
.pbox{display:flex;gap:16px;align-items:center;margin-bottom:18px;padding:18px}
.pbox .nm{flex:1;min-width:0}.pbox h2{margin:0;font-size:24px;letter-spacing:-.02em}.pbox small{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;padding:0 4px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--muted);font-weight:600}
.bars i{display:block;width:100%;max-width:34px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,#43a0ff,#2f9e44);min-height:4px;opacity:.9}
.bars b{font-size:12px;color:var(--text)}
.items .it{display:grid;grid-template-columns:1.6fr 1fr .6fr 1.4fr 30px;gap:8px;margin-bottom:8px}
@media(max-width:700px){.items .it{grid-template-columns:1fr 1fr;padding:12px;border-radius:18px;background:var(--field)}.items .it .x{justify-self:end}}
.x{width:30px;height:30px;border-radius:50%;border:0;background:rgba(229,72,77,.15);color:var(--bad);font-size:18px;line-height:1;display:grid;place-items:center;align-self:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:0;background:var(--field);box-shadow:0 0 0 .5px var(--field-bd);font-size:12.5px;font-weight:600}
.pick{position:relative}
.pick .res{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:20;max-height:260px;overflow:auto;border-radius:18px;background:var(--glass-solid);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 14px 40px rgba(0,0,0,.25),0 0 0 .5px var(--sep)}
.pick .res button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;font-size:14.5px}
.pick .res button:hover{background:rgba(var(--accent-rgb),.12)}.pick .res small{color:var(--muted);display:block}

.chip.sel{background:linear-gradient(180deg,#2d8ff0,#0a68c9);color:#fff;box-shadow:0 4px 12px rgba(11,114,214,.4)}
.hero{padding:22px 22px 18px;margin-bottom:18px}
.hero small{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.hero .when{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.hero .who{font-size:16px;color:var(--text)}.hero .acts{margin-top:14px}
.bigcode{font-size:40px;font-weight:800;letter-spacing:.12em;text-align:center;padding:18px 8px;margin:6px 0 12px;border-radius:22px;background:var(--field);box-shadow:0 0 0 .5px var(--field-bd);font-variant-numeric:tabular-nums}
a.btn{text-decoration:none}
/* asystent AI */
.ai{padding:16px 16px 14px;border-radius:26px;margin-bottom:16px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.14),rgba(47,158,68,.12));box-shadow:0 0 0 .5px rgba(var(--accent-rgb),.35),inset 0 1px 0 var(--glass-in)}
.ai h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}.ai h3 svg{color:var(--accent)}
.ai .sub2{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.ai .res{margin-top:12px}.ai .blk{margin:12px 0 4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ai .it2{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:var(--field);margin-bottom:6px;box-shadow:0 0 0 .5px var(--field-bd)}
.ai .it2 .mid{flex:1;min-width:0;font-size:14px}.ai .it2 small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ai .it2 .btn{flex:none}.ai ul{margin:4px 0 0;padding-left:20px;font-size:14px}
.ai .warnbox{padding:11px 14px;border-radius:16px;background:rgba(229,72,77,.14);box-shadow:0 0 0 .5px rgba(229,72,77,.4);margin-top:10px;font-size:14px}
.ai .disc{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5}
.ai .spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(var(--accent-rgb),.3);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.pill.aitag{background:linear-gradient(90deg,rgba(var(--accent-rgb),.18),rgba(47,158,68,.18));color:var(--accent)}
/* arkusz (modal) */
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(10,20,34,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:18px;overflow:auto}
.modal.on{display:grid;animation:fade .25s}
.sheet{width:min(640px,100%);max-height:calc(100vh - 36px);overflow:auto;padding:24px;animation:rise .4s cubic-bezier(.2,.9,.25,1)}
.sheet h2{margin:0 0 16px;font-size:24px;letter-spacing:-.025em}
.sheet .bt{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:-24px;padding:14px 0 2px}
@keyframes fade{from{opacity:0}}
.sheet.glass::before,.sheet.glass::after{display:none}
.sheet.glass{box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.45),inset 0 1.5px 0 var(--glass-in)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translate(-50%,30px);z-index:200;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;
  transition:all .4s cubic-bezier(.34,1.4,.64,1);background:var(--glass-solid);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 var(--glass-in)}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{color:var(--bad)}

/* logowanie */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(440px,100%);padding:30px 28px 26px;text-align:center}
.lbox img.logo{width:230px;max-width:80%;margin:0 auto 6px;display:block}
.lbox h1{font-size:22px;letter-spacing:-.02em;margin:6px 0 4px}
.lbox p{color:var(--muted);margin:0 0 18px;font-size:14px}
.lbox form{text-align:left}
.lbox .alt{margin-top:14px;font-size:13.5px;color:var(--muted);text-align:center}
.lbox .alt a,.link{color:var(--accent);font-weight:600;cursor:pointer}
.personas{display:grid;gap:8px;text-align:left;margin-top:6px}
.personas button{display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;border-radius:18px;background:var(--field);box-shadow:0 0 0 .5px var(--field-bd);text-align:left;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.personas button:hover{transform:scale(1.02)}.personas small{display:block;color:var(--muted)}
.demo-tag{display:inline-block;padding:3px 11px;border-radius:999px;background:rgba(232,137,12,.18);color:var(--warn);font-size:12px;font-weight:700;margin-bottom:10px}

/* dolny pasek (telefon) */
.tabbar{display:none}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);padding:max(10px,env(safe-area-inset-top)) 12px calc(110px + env(safe-area-inset-bottom));gap:0}
  .side{display:none}
  .mtop{display:flex;align-items:center;gap:12px;margin:2px 2px 12px}
  .mtop img{height:40px;display:block}.mtop .sp{flex:1}
  .top h1{font-size:30px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:minmax(0,1fr)}
  .cols>div,.card{min-width:0}
  .tabbar{display:flex;position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:50;padding:6px;border-radius:32px;
    background:var(--glass);-webkit-backdrop-filter:blur(36px) saturate(200%);backdrop-filter:blur(36px) saturate(200%);box-shadow:var(--shadow),inset 0 1.5px 0 var(--glass-in),0 0 0 .5px var(--sep)}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border:0;background:none;border-radius:26px;font-size:11px;font-weight:600;color:var(--muted);transition:background .3s,color .3s}
  .tabbar svg{width:24px;height:24px}
  .tabbar a.on{color:var(--accent);background:rgba(255,255,255,.7);box-shadow:0 2px 10px rgba(20,70,140,.16),inset 0 1px 0 #fff}
  [data-theme=dark] .tabbar a.on{background:rgba(255,255,255,.16)}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 100px)}
  .sheet{padding:20px 18px}
  .modal{place-items:end center;padding:8px}
  .sheet{border-radius:30px 30px 22px 22px}
}

/* druk */
#printroot{display:none}
.paper{background:#fff;color:#12202f;width:210mm;max-width:100%;min-height:140mm;padding:14mm 16mm;font:13px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.25);border-radius:6px;margin:0 auto}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #0b72d6;padding-bottom:10px;margin-bottom:12px}
.paper .ph img{height:62px;display:block}
.paper .ph .cl{text-align:right;font-size:11.5px;color:#455468;line-height:1.5}.paper .ph .cl b{color:#12202f;font-size:13px}
.paper h3{margin:4px 0 2px;font-size:17px;letter-spacing:.02em;color:#0b72d6;text-transform:uppercase}
.paper .no{font-size:12px;color:#455468;margin-bottom:10px}
.paper .two{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:10px 0}
.paper .two div{font-size:12.5px}.paper .two small{display:block;color:#6a788a;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.paper table{width:100%;border-collapse:collapse;margin:8px 0}
.paper th{background:#eef4fb;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#455468;padding:7px 8px;border-bottom:1.5px solid #cfdceb}
.paper td{padding:8px;border-bottom:1px solid #e2eaf3;vertical-align:top}
.paper .sign{display:flex;justify-content:space-between;gap:24px;margin-top:30px;align-items:flex-end}
.paper .sign div{flex:1;font-size:12px;color:#455468}.paper .sign .ln{border-top:1px solid #7a8aa0;margin-top:34px;padding-top:4px}
.paper .foot{margin-top:18px;padding-top:8px;border-top:1px solid #d6e0ec;font-size:10.5px;color:#6a788a}
.paper .box{border:1px solid #cfdceb;border-radius:8px;padding:9px 12px;margin:8px 0;font-size:12.5px;background:#f7fafd}
.paper .cancel{color:#c0272d;font-weight:800;border:2px solid #c0272d;display:inline-block;padding:2px 10px;border-radius:6px;margin-left:10px;font-size:13px}
.pwrap{overflow:auto;padding:4px}
@media print{
  body>*:not(#printroot){display:none!important}
  #printroot{display:block!important}
  #printroot .paper{box-shadow:none;border-radius:0;width:100%;padding:0;min-height:0}
  @page{size:A4;margin:14mm}
  body{background:#fff!important;transition:none!important}
  *{transition:none!important;animation:none!important}
}

const isoDow=d=>(d.getDay()+6)%7+1;
const DemoRpc={
  medicov_public_doctors(){return Demo.db.profiles.filter(p=>p.role==='doctor'&&p.active).map(p=>({id:p.id,full_name:p.full_name,specialty:p.specialty||'',license_no:p.license_no||''}))},
  medicov_free_slots({p_doctor,p_from,p_to}){
    const out=[],min=Date.now()+3600e3,booked=new Set(Demo.db.visits.filter(v=>v.doctor_id===p_doctor&&v.status!=='odwolana').map(v=>new Date(v.scheduled_at).getTime()));
    const from=new Date(p_from+'T00:00'),to=new Date(p_to+'T00:00'),lim=new Date(from);lim.setDate(lim.getDate()+30);const end=to<lim?to:lim;
    for(let d=new Date(from);d<=end;d.setDate(d.getDate()+1)){
      Demo.db.availability.filter(a=>a.doctor_id===p_doctor&&a.weekday===isoDow(d)).forEach(a=>{
        const [sh,sm]=a.start_time.split(':').map(Number),[eh,em]=a.end_time.split(':').map(Number);
        for(let m=sh*60+sm;m+a.slot_minutes<=eh*60+em;m+=a.slot_minutes){const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,m);if(t.getTime()>min&&!booked.has(t.getTime()))out.push({slot:t.toISOString()})}});
    }
    return out.sort((a,b)=>a.slot<b.slot?-1:1)},
  medicov_book_visit({p_doctor,p_at,p_type}){
    const me=Demo.db.patients.find(p=>p.user_id===ME.id);if(!me)throw new Error('To konto nie jest połączone z kartą pacjenta');
    if(!['Konsultacja','Wizyta kontrolna','Teleporada'].includes(p_type||'Konsultacja'))throw new Error('Niedozwolony rodzaj wizyty');
    const at=new Date(p_at).toISOString();
    if(!DemoRpc.medicov_free_slots({p_doctor,p_from:dKey(at),p_to:dKey(at)}).some(s=>s.slot===at))throw new Error('Ten termin jest już zajęty lub niedostępny. Wybierz inny.');
    if(Demo.db.visits.filter(v=>v.patient_id===me.id&&v.status==='zaplanowana'&&new Date(v.scheduled_at)>new Date()).length>=5)throw new Error('Masz już 5 zaplanowanych wizyt. Odwołaj jedną lub zadzwoń do przychodni.');
    const v={id:uid(),patient_id:me.id,doctor_id:p_doctor,student_id:null,scheduled_at:at,type:p_type||'Konsultacja',status:'zaplanowana',created_by:ME.id,created_at:iso()};
    Demo.db.visits.push(v);Demo._log('INSERT','visits',v.id);Demo.save();return v.id},
  medicov_cancel_visit({p_id}){
    const me=Demo.db.patients.find(p=>p.user_id===ME.id),v=Demo.db.visits.find(x=>x.id===p_id);
    if(!me||!v||v.patient_id!==me.id||v.status!=='zaplanowana'||new Date(v.scheduled_at).getTime()<=Date.now()+2*3600e3)throw new Error('Tej wizyty nie można odwołać online (możliwe do 2 godzin przed terminem). Zadzwoń do przychodni.');
    v.status='odwolana';Demo._log('UPDATE','visits',v.id);Demo.save();return null},
  medicov_update_my_contact({p_phone,p_email,p_address}){
    const me=Demo.db.patients.find(p=>p.user_id===ME.id);if(!me)throw new Error('To konto nie jest połączone z kartą pacjenta');
    Object.assign(me,{phone:p_phone,email:p_email,address:p_address});Demo._log('UPDATE','patients',me.id);Demo.save();return null},
  medicov_generate_link_code({p_patient}){
    const p=Demo.db.patients.find(x=>x.id===p_patient);if(!p)throw new Error('Nie znaleziono pacjenta');if(p.user_id)throw new Error('Ten pacjent ma już połączone konto w portalu');
    const c=(crypto.randomUUID().replace(/-/g,'').slice(0,10)).toUpperCase();p.link_code=c;p.link_code_expires=new Date(Date.now()+14*864e5).toISOString();Demo.save();return c.slice(0,5)+'-'+c.slice(5)},
  medicov_claim_patient({p_code}){
    const c=String(p_code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    const p=Demo.db.patients.find(x=>x.link_code===c&&!x.user_id&&new Date(x.link_code_expires)>new Date());if(!p)return null;
    const pr=Demo.db.profiles.find(x=>x.id===ME.id);if(pr&&!['pending','patient'].includes(pr.role))throw new Error('To konto należy do pracownika przychodni i nie może być kontem pacjenta');
    if(pr)pr.role='patient';p.user_id=ME.id;p.link_code=null;Demo._log('UPDATE','patients',p.id);Demo.save();return p.id}
};
function mockAI(p){

async function loadAll(){
  const lim={limit:2000};
  if(ME.role==='patient'){
    const [pa,vi,rx,st,docs]=await Promise.all([A.list('patients',{limit:5}),A.list('visits',{order:['scheduled_at',false],limit:500}),
      A.list('prescriptions',{order:['created_at',false],limit:500}),A.list('clinic_settings',{limit:1}),A.rpc('medicov_public_doctors',{})]);
    D.patients=pa;D.visits=vi;D.prescriptions=rx;D.settings=st[0]||{name:'Medicov MGS – Centrum Medyczne'};D._notes=[];D.avail=[];
    D.profiles=[ME,...docs.filter(d=>d.id!==ME.id).map(d=>({...d,role:'doctor',active:true}))];return;
  }
  const [pr,pa,vi,rx,st]=await Promise.all([
    A.list('profiles',{order:['full_name']}),A.list('patients',{order:['last_name'],...lim}),A.list('visits',{order:['scheduled_at',false],...lim}),
    can.rxRead()?A.list('prescriptions',{order:['created_at',false],...lim}):Promise.resolve([]),A.list('clinic_settings',{limit:1})]);
  D.profiles=pr;D.patients=pa;D.visits=vi;D.prescriptions=rx;D.settings=st[0]||{name:'Medicov MGS – Centrum Medyczne'};
  D._notes=ME.role==='doctor'?await A.list('visit_notes',{limit:1000}).catch(()=>[]):[];

}

  const mx=Math.max(1,...days.map(d=>d.n));

  return head(`${greet}, ${esc((ME.full_name||'').replace(/^dr\s+/i,'').split(' ')[0]||'')}`,new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}),q)
   +(ME.role==='student'?`<div class="banner info">${ic('info')}<div><b>Konto studenta.</b> Widzisz harmonogram i recepty, a notatki możesz prowadzić tylko przy wizytach, do których przypisał Cię lekarz. Każdą notatkę zatwierdza lekarz.</div></div>`:'')

function peselInfo(s){
  s=String(s||'').replace(/\s/g,'');if(!/^\d{11}$/.test(s))return {ok:false};
  const w=[1,3,7,9,1,3,7,9,1,3];let sum=0;for(let i=0;i<10;i++)sum+=w[i]*+s[i];
  const ok=(10-sum%10)%10===+s[10];
  let y=+s.slice(0,2),m=+s.slice(2,4),d=+s.slice(4,6);const c=Math.floor(m/20);m%=20;y+=[1900,2000,2100,2200,1800][c];
  const date=`${y}-${pad(m)}-${pad(d)}`;return {ok,date,sex:+s[9]%2?'M':'K',valid:ok&&!isNaN(new Date(date))};
}

function bindPesel(){
  const el=$('#pesel');if(!el)return;
  const upd=()=>{const h=$('#peselhint'),v=el.value.trim();if(!v){h.textContent='';return}
    const i=peselInfo(v);if(!i.ok){h.className='hint bad';h.textContent=v.length<11?'PESEL ma 11 cyfr':'Niepoprawna suma kontrolna PESEL';return}
    h.className='hint ok';h.textContent='PESEL poprawny';if(i.valid){if(!$('#bdate').value)$('#bdate').value=i.date;if(!$('#sex').value)$('#sex').value=i.sex}};

const BK={doc:null,days:{},day:null,slot:null,loading:false,err:''};
async function bkLoad(){
  BK.loading=true;BK.slot=null;BK.err='';rerender();
  const from=dKey(new Date()),to=new Date();to.setDate(to.getDate()+28);
  try{
    const r=await A.rpc('medicov_free_slots',{p_doctor:BK.doc,p_from:from,p_to:dKey(to)});
    BK.days={};(r||[]).forEach(x=>{const s=new Date(x.slot).toISOString(),k=dKey(s);(BK.days[k]=BK.days[k]||[]).push(s)});
    const keys=Object.keys(BK.days).sort();if(!BK.day||!BK.days[BK.day])BK.day=keys[0]||null;
  }catch(e){BK.err=e.message||'Nie udało się pobrać terminów'}

const AI={used:false,pending:[]};
function aiBox(ctx,patientId,prefill=''){
  AI.used=false;
  return `<div class="ai" data-ctx="${ctx}" data-patient="${patientId||''}"><h3>${ic('spark')} Asystent AI <span class="pill aitag">sugestia – decyduje lekarz</span></h3>
   <div class="sub2">Opisz powód wizyty lub dolegliwości. Asystent zaproponuje możliwe rozpoznania, leki i zalecenia, a Ty zatwierdzasz wybrane pozycje albo piszesz samodzielnie.</div>
   <textarea class="field aic" placeholder="np. kaszel i gorączka 38,5 °C od 3 dni, ból gardła" style="min-height:70px">${esc(prefill)}</textarea>
   <input class="field aim" placeholder="Przyjmowane leki (opcjonalnie)" style="margin-top:8px">
   <div class="acts" style="margin-top:10px"><button type="button" class="btn primary sm" data-act="aiAsk">${ic('spark')} Zapytaj AI</button></div>
   <div class="res aires"></div></div>`;
}
function aiPatient(box){
  const f=box.closest('form'),h=f&&f.querySelector('input[name=patient_id]');
  return (h&&h.value)||box.dataset.patient||'';
}
function aiRender(box,r){
  const pid=aiPatient(box),p=pid?pat(pid):null,al=norm(p?.allergies||''),ctx=box.dataset.ctx;
  const conflict=m=>al&&norm(m.name).split(/[\s,/]+/).some(w=>w.length>=4&&al.includes(w.slice(0,6)));
  const rx=ctx==='rx';
  let h='';
  if(r._demo)h+=`<div class="banner info" style="margin:0 0 10px">${ic('info')}<div><b>Odpowiedź demonstracyjna.</b> Prawdziwe AI działa po podłączeniu Supabase i klucza Anthropic (instrukcja w README).</div></div>`;
  if(r.summary)h+=`<div style="font-size:14.5px;margin-top:4px"><b>${esc(r.summary)}</b></div>`;
  if(r.red_flags?.length)h+=`<div class="warnbox"><b>⚠ Objawy alarmowe do wykluczenia:</b><ul>${r.red_flags.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if(r.differential?.length)h+=`<div class="blk">Możliwe rozpoznania</div>`+r.differential.map((d,i)=>`<div class="it2"><div class="mid"><b>${esc(d.name)}</b> <span class="pill ${d.likelihood==='wysokie'?'green':d.likelihood==='średnie'?'warn':'gray'}">${esc(d.likelihood)}</span> ${d.icd10?`<span class="pill gray">${esc(d.icd10)}</span>`:''}<small>${esc(d.reasoning)}</small></div>
    ${ctx==='visit'?`<button type="button" class="btn sm" data-act="aiDx" data-i="${i}">Użyj</button>`:''}</div>`).join('');
  if(r.clarifying_questions?.length)h+=`<div class="blk">Warto dopytać</div><ul>${r.clarifying_questions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(r.tests?.length)h+=`<div class="blk">Badania do rozważenia</div><ul>${r.tests.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(r.meds?.length)h+=`<div class="blk">Sugerowane leki</div>`+r.meds.map((m,i)=>`<div class="it2"><div class="mid"><b>${esc(m.name)}</b> ${esc(m.dose)} ${m.form?'• '+esc(m.form):''} ${conflict(m)?'<span class="pill red">⚠ możliwa alergia pacjenta</span>':''}
    <small>${esc(m.dosage)} • ${esc(m.quantity)}</small><small>${esc(m.rationale)}</small>${m.cautions?`<small>Uwaga: ${esc(m.cautions)}</small>`:''}</div>
    <button type="button" class="btn sm green" data-act="aiMed" data-i="${i}">${rx?'Dodaj lek':'Do recepty'}</button></div>`).join('');
  if(r.recommendations?.length)h+=`<div class="blk">Zalecenia</div>`+r.recommendations.map((x,i)=>`<div class="it2"><div class="mid">${esc(x)}</div>${ctx==='visit'?`<button type="button" class="btn sm" data-act="aiRec" data-i="${i}">Dodaj</button>`:''}</div>`).join('');
  h+=`<div class="disc">Sugestia wygenerowana przez AI może zawierać błędy i nie zastępuje oceny lekarza. Zweryfikuj z aktualnymi wytycznymi i Charakterystyką Produktu Leczniczego. Do modelu wysyłane są wyłącznie: opis dolegliwości, wiek, płeć, alergie i przyjmowane leki – bez imienia, nazwiska i PESEL.</div>`;
  $('.aires',box).innerHTML=h;
}
function aiAddToRxForm(box,m){
  const f=box.closest('form'),items=f&&f.querySelector('#items');if(!items)return false;
  const rows=$$('.it',items),first=rows[0];
  const empty0=first&&rows.length===1&&!$('[name=i_name]',first).value.trim();
  const row=itemRow({name:m.name,dose:m.dose,qty:m.quantity,dosage:m.dosage});
  if(empty0)first.outerHTML=row;else items.insertAdjacentHTML('beforeend',row);
  return true;
}

  aiDx:el=>{const box=el.closest('.ai'),d=box._res.differential[+el.dataset.i],f=box.closest('form');
    const c=$('input[name=diagnosis_code]',f),n=$('input[name=diagnosis]',f);if(c)c.value=d.icd10||'';if(n)n.value=d.name;AI.used=true;toast('Wstawiono rozpoznanie – zatwierdź zapisem dokumentacji')},
  aiRec:el=>{const box=el.closest('.ai'),t=$('textarea[name=recommendations]',box.closest('form'));if(!t)return;
    t.value=(t.value?t.value.replace(/\s*$/,'')+'\n':'')+'• '+box._res.recommendations[+el.dataset.i];toast('Dodano do zaleceń')},
  aiMed:el=>{const box=el.closest('.ai'),m=box._res.meds[+el.dataset.i];
    if(box.dataset.ctx==='rx'){aiAddToRxForm(box,m);toast('Dodano lek do recepty – sprawdź dawkowanie')}
    else{AI.pending.push({...m});toast('Dodano do przyszłej recepty ('+AI.pending.length+')');
      const b=$('.aiToRx',box.closest('form'));if(b){b.classList.remove('hide');b.textContent='Utwórz receptę z wybranych ('+AI.pending.length+')'}}},
  aiToRx:()=>{const v=location.hash.match(/#\/visits\/(.+)$/);const vv=v&&D.visits.find(x=>x.id===v[1]);openRxForm(vv?.patient_id,vv?.id,AI.pending.splice(0))}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(!f)return;
  if(el.tagName==='A'&&!el.getAttribute('href'))e.preventDefault();
  if(el.dataset.act==='closeSheet'&&el.tagName==='A'){setTimeout(closeSheet,0);return}
  f(el);
});
async function saveNotes(id,f){
  const fd=new FormData(f);const row={visit_id:id,interview:fd.get('interview'),examination:fd.get('examination'),diagnosis_code:(fd.get('diagnosis_code')||'').toUpperCase(),diagnosis:fd.get('diagnosis'),recommendations:fd.get('recommendations'),updated_by:ME.id,updated_at:iso()};
  if(AI.used&&ME.role==='doctor')row.ai_assisted=true;
  const n=await A.upsert('visit_notes',row,'visit_id');NOTES[id]={...NOTES[id],...n};
}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const t=f.dataset.form,fd=new FormData(f);
  if(t==='signin')guard(async()=>{const u=await A.signIn({email:fd.get('email'),password:fd.get('password')});await afterLogin(u.id)});
  else if(t==='signup')guard(async()=>{const r=await A.signUp({email:fd.get('email'),password:fd.get('password'),full_name:fd.get('full_name')});
    if(r.session)await afterLogin(r.user.id);else{toast('Konto utworzone. Sprawdź e-mail, aby potwierdzić adres.');window._lm='in';route()}});
  else if(t==='patsignup')guard(async()=>{const r=await A.signUp({email:fd.get('email'),password:fd.get('password'),full_name:fd.get('full_name'),invite_code:fd.get('code')});
    if(r.session)await afterLogin(r.user.id);else{toast('Konto utworzone. Potwierdź adres e-mail z wiadomości, a potem zaloguj się.');window._lm='in';route()}});
  else if(t==='claim')guard(async()=>{const r=await A.rpc('medicov_claim_patient',{p_code:fd.get('code')});
    if(!r){toast('Nieprawidłowy lub wygasły kod',true);return}window._claimFail=false;toast('Konto połączone z kartą pacjenta');await afterLogin(ME.id)});
  else if(t==='notes')guard(async()=>{await saveNotes(f.dataset.id,f);toast('Zapisano dokumentację');route()});
  else if(t==='settings')guard(async()=>{const s=await A.update('clinic_settings',1,Object.fromEntries(fd));D.settings=s;toast('Zapisano dane placówki')});
});
document.addEventListener('input',e=>{
  if(e.target.id==='pq'){PQ=e.target.value;const q=norm(PQ);$('#plist').innerHTML=plistHtml(D.patients.filter(p=>!q||norm(`${p.first_name} ${p.last_name} ${p.pesel||''} ${p.phone||''}`).includes(q)).sort((a,b)=>norm(a.last_name+a.first_name)<norm(b.last_name+b.first_name)?-1:1))}
  else if(e.target.id==='rq'){RQ=e.target.value;const q=norm(RQ);const l=D.prescriptions.filter(r=>!q||norm(`${pname(pat(r.patient_id))} ${r.number} ${r.items.map(i=>i.name).join(' ')}`).includes(q));$('#rlist').innerHTML=l.length?l.slice(0,200).map(rxRow).join(''):empty('Brak recept','rx')}
});
document.addEventListener('change',e=>{
  if(e.target.id==='vday'&&e.target.value){VS.day=e.target.value;route()}
  else if(e.target.id==='vdoc'){VS.doc=e.target.value;route()}
});
window.addEventListener('hashchange',()=>{const m=(location.hash||'').match(/^#\/visits\/(.+)$/);if(m)setTimeout(()=>bindVisit(m[1]),0)});

/* Dodatek: remove w adapterach */
Sb.remove=async function(t,id){const {error}=await this.c.from(this.T(t)).delete().eq('id',id);if(error)throw error};
Demo.remove=async function(t,id){const a=this.db[t],i=a.findIndex(x=>x.id===id);if(i<0)return;
  if(t==='patients'&&(this.db.visits.some(v=>v.patient_id===id)||this.db.prescriptions.some(r=>r.patient_id===id)))throw new Error('Nie można usunąć pacjenta, który ma wizyty lub recepty.');
  a.splice(i,1);this._log('DELETE',t,id);this.save()};

/* ===================== MOTYW ===================== */
function isDark(){return document.documentElement.dataset.theme==='dark'}
function setTheme(t){document.documentElement.dataset.theme=t;store.set('medicov-theme',t);
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=t==='dark'?'#070d16':'#eaf2fb'}
function initTheme(){let t=store.get('medicov-theme');setTheme(t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))}
addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;$$('.glass').forEach(g=>{const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px')})},{passive:true});

boot();
</script>
